name: Build Android APK (User)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build:user

      # ✅ تثبيت Capacitor CLI محليًا
      - name: Install Capacitor CLI
        run: npm install --save-dev @capacitor/cli

      # ✅ استخدام npx مع تحديد الحزمة لضمان العثور على الأمر
      - name: Add Android platform
        run: npx -p @capacitor/cli cap add android

      - name: Sync Capacitor
        run: npx -p @capacitor/cli cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: user-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
